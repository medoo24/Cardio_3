<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive medical learning website for valvular heart disease: examination, diagnosis, imaging, management, comparison tools, and clinical cases.">
  <title>ValveLab | Interactive Valvular Heart Disease</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Course navigation">
      <div class="brand-block">
        <a class="brand" href="#overview" data-route="overview" aria-label="ValveLab home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" role="img">
              <path d="M24 42S6.8 31.9 6.8 18.3C6.8 11.8 11.2 7 17.1 7c3.4 0 5.8 1.5 6.9 3.5C25.1 8.5 27.5 7 30.9 7c5.9 0 10.3 4.8 10.3 11.3C41.2 31.9 24 42 24 42Z" fill="currentColor" opacity=".18"/>
              <path d="M8 24h8l3-7 5 15 4-10 3 5h9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span>
            <strong>ValveLab</strong>
            <small>Cardiology study studio</small>
          </span>
        </a>
        <button class="icon-button sidebar-close" id="sidebar-close" type="button" aria-label="Close navigation">
          <span aria-hidden="true">×</span>
        </button>
      </div>

      <nav class="course-nav" id="course-nav">
        <p class="nav-eyebrow">Study map</p>
        <button class="nav-item is-active" data-route="overview" type="button">
          <span class="nav-icon" aria-hidden="true">01</span>
          <span><strong>Overview</strong><small>Core model & roadmap</small></span>
        </button>
        <button class="nav-item" data-route="principles" type="button">
          <span class="nav-icon" aria-hidden="true">02</span>
          <span><strong>General principles</strong><small>Murmurs, imaging, stages</small></span>
        </button>
        <button class="nav-item" data-route="mitral-stenosis" type="button">
          <span class="nav-icon" aria-hidden="true">03</span>
          <span><strong>Mitral stenosis</strong><small>Rheumatic obstruction</small></span>
        </button>
        <button class="nav-item" data-route="mitral-regurgitation" type="button">
          <span class="nav-icon" aria-hidden="true">04</span>
          <span><strong>Mitral regurgitation</strong><small>Primary, secondary, acute</small></span>
        </button>
        <button class="nav-item" data-route="mvp" type="button">
          <span class="nav-icon" aria-hidden="true">05</span>
          <span><strong>Mitral valve prolapse</strong><small>Click–murmur syndrome</small></span>
        </button>
        <button class="nav-item" data-route="aortic-stenosis" type="button">
          <span class="nav-icon" aria-hidden="true">06</span>
          <span><strong>Aortic stenosis</strong><small>Severity & AVR decisions</small></span>
        </button>
        <button class="nav-item" data-route="aortic-regurgitation" type="button">
          <span class="nav-icon" aria-hidden="true">07</span>
          <span><strong>Aortic regurgitation</strong><small>Pulse signs & LV response</small></span>
        </button>
        <button class="nav-item" data-route="tricuspid" type="button">
          <span class="nav-icon" aria-hidden="true">08</span>
          <span><strong>Tricuspid disease</strong><small>JVP, congestion, RV</small></span>
        </button>
        <button class="nav-item" data-route="prosthetic" type="button">
          <span class="nav-icon" aria-hidden="true">09</span>
          <span><strong>Prosthetic valves</strong><small>Choice & complications</small></span>
        </button>
        <button class="nav-item nav-item-tool" data-route="murmur-lab" type="button">
          <span class="nav-icon" aria-hidden="true">⌁</span>
          <span><strong>Murmur laboratory</strong><small>Interactive bedside reasoning</small></span>
        </button>
        <button class="nav-item nav-item-tool" data-route="cases" type="button">
          <span class="nav-icon" aria-hidden="true">?</span>
          <span><strong>Clinical cases</strong><small>Practice with explanations</small></span>
        </button>
        <button class="nav-item nav-item-tool" data-route="sources" type="button">
          <span class="nav-icon" aria-hidden="true">§</span>
          <span><strong>Sources & notes</strong><small>Guidelines and scope</small></span>
        </button>
      </nav>

      <div class="sidebar-progress" aria-label="Course progress">
        <div>
          <span>Visited modules</span>
          <strong id="progress-label">1 / 12</strong>
        </div>
        <div class="progress-track" aria-hidden="true">
          <span id="progress-bar" style="width:8.33%"></span>
        </div>
        <button class="text-button" id="reset-progress" type="button">Reset progress</button>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>

    <div class="workspace">
      <header class="topbar">
        <button class="icon-button menu-button" id="menu-button" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
          <span aria-hidden="true">☰</span>
        </button>
        <div class="topbar-title">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="current-section-label">Overview</span>
        </div>
        <div class="topbar-actions">
          <label class="search-box" for="site-search">
            <span aria-hidden="true">⌕</span>
            <input id="site-search" type="search" placeholder="Search the chapter" autocomplete="off">
            <kbd>/</kbd>
          </label>
          <button class="icon-button" id="print-button" type="button" aria-label="Print current module" title="Print current module">
            <span aria-hidden="true">⎙</span>
          </button>
        </div>
        <div class="search-results" id="search-results" role="listbox" aria-label="Search results" hidden></div>
      </header>

      <main id="main-content" tabindex="-1">
        <div id="app-content" aria-live="polite"></div>
      </main>

      <footer class="site-footer">
        <p><strong>ValveLab</strong> is an educational study aid. It does not replace patient-specific assessment or complete guideline documents.</p>
        <button class="text-button" data-route="sources" type="button">Review sources and limitations</button>
      </footer>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
